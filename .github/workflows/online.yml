name: Online co-op checks
on:
  push:
    branches: [main, codex/online-multiplayer]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm run setup
      - run: npm run check
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker build -t evergrow-online .
      - run: docker run -d --name evergrow-smoke -p 127.0.0.1:3001:3001 -v evergrow-smoke-data:/data evergrow-online
      - run: node scripts/smoke-online.mjs http://127.0.0.1:3001
      - if: always()
        run: |
          docker logs evergrow-smoke || true
          docker rm -f evergrow-smoke || true
          docker volume rm evergrow-smoke-data || true
